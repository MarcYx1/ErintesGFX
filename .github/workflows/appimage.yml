name: AppImage

# Tag vX.Y.Z (must match the version in CMakeLists.txt) -> build, test, release with the AppImage.
# Manual run: build + test, AppImage as a workflow artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches CMake version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^project(ErintesGFX VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != CMake version $v"; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools \
            qt6-wayland libgl1-mesa-dev nlohmann-json3-dev file

      - name: Test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
          ./build/textdb_check
          ./build/erintesgfx --version

      - name: Get linuxdeploy (pinned, checksum checked)
        run: |
          mkdir -p build-appimage/tools && cd build-appimage/tools
          curl -fsSL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          sha256sum -c - <<'SUMS'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage
          SUMS
          chmod +x *.AppImage

      - name: Build AppImage
        run: packaging/appimage.sh

      - name: Smoke test AppImage
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 build-appimage/ErintesGFX-*.AppImage --version

      - uses: actions/upload-artifact@v4
        with:
          name: ErintesGFX-AppImage
          path: build-appimage/ErintesGFX-*.AppImage

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build-appimage/ErintesGFX-*.AppImage \
            --title "ErintesGFX $GITHUB_REF_NAME" --notes-file packaging/release-notes.md
